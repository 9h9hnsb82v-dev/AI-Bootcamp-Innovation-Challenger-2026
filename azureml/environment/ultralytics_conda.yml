name: resource-ultralytics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      - torchvision==0.20.1
      - ultralytics==8.3.40      # AGPL-3.0 — 내부 비교 실험 전용(배포·공개 금지, 사용자 승인 전)
      - opencv-python-headless<4.11
      - pandas<2.3
      - scikit-learn
      - azureml-mlflow
