$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# YOLO11m-cls 전체 데이터 재학습 (사용자 요청 2026-11-13: 멘토링 후 3개 부품 원본 전체 51,986장, 30에폭, 학습곡선 확인)
# Ultralytics AGPL-3.0 - 내부 실험 전용, 코드·모델 공개/배포 금지(사용자 허락 전)
# 데이터 자산: az ml data create -n aihub-full-640 -v 1 --type uri_folder --path data/processed/aihub_full
# 실행: az ml job create -f azureml/job_yolo11m_cls_full_h100.yml -w AIBIC_10_24_workspace -g stu_AIBIC2026_15_RG_EUS2
type: command
display_name: resource-yolo11m-cls-full-e30-h100
experiment_name: resource-predict-ai-vision
description: AI-Hub 도어/범퍼/휀더 원본 전체(학습 36,966 / 검증 9,241 / 시험 1,080 고정 / holdout 4,699) YOLO11m-cls 448px 30에폭
code: ..
environment: azureml:resource-ultralytics@latest
compute: azureml:gpu-h100
resources:
  shm_size: 32g
inputs:
  data:
    type: uri_folder
    path: azureml:aihub-full-640:1
    mode: download
outputs:
  results:
    type: uri_folder
environment_variables:
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
command: >-
  pip uninstall -y -q opencv-python &&
  pip install -q --force-reinstall --no-deps "opencv-python-headless<4.11" &&
  python azureml/yolo/run_yolo11_cls.py ${{inputs.data}} ${{outputs.results}} --models yolo11m-cls --epochs 30 --img 448 --batch 64
