$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# 세션 비겹침 재평가(사용자 승인 2026-11-14, 검출 모델 포함). 분할: ml/vision/resplit_session.py (촬영일 통째, 시험 6,946장·60초 이내 겹침 0%)
type: command
experiment_name: resource-predict-ai-vision
code: ..
compute: azureml:gpu-h100
resources:
  shm_size: 32g
display_name: resource-sd-effnet-b0-e5
description: 세션 비겹침 분할 EfficientNet-B0 448px 5에폭
environment: azureml:resource-yolov7@latest
inputs:
  data: {type: uri_folder, path: azureml:aihub-full-640:1, mode: download}
  manifest: {type: uri_file, path: ../data/processed/aihub_full/manifest_sd.csv}
outputs:
  results: {type: uri_folder}
environment_variables: {RESOURCE_VISION_IMG: "448", RESOURCE_VISION_TAG: "_sd_e5", RESOURCE_VISION_WORKERS: "8"}
command: >-
  mkdir -p data/processed && ln -s ${{inputs.data}} data/processed/aihub_full &&
  RESOURCE_VISION_MANIFEST=${{inputs.manifest}} RESOURCE_VISION_OUT=${{outputs.results}} python -m ml.vision.train --epochs 5 --batch 32
