$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# YOLO11 분류 비교 실험 (사용자 승인 2026-11-11, A안). Ultralytics AGPL-3.0 - 내부 실험 전용, 코드·모델 공개/배포 금지(사용자 허락 전)
# 실행: az ml job create -f azureml/job_yolo11m_cls_e50_h100.yml -w AIBIC_10_24_workspace -g stu_AIBIC2026_15_RG_EUS2  (사용자 요청 2026-11-11: 에폭 50)
type: command
display_name: resource-yolo11m-cls-e50-split821-h100
experiment_name: resource-predict-ai-vision
description: AI-Hub 6클래스 YOLO11m-cls 50에폭, 448px, 8:2:1 분할(EfficientNet split821과 동일)
code: ..
environment: azureml:resource-ultralytics@latest
compute: azureml:gpu-h100
resources:
  shm_size: 16g   # DataLoader 워커 공유 메모리(기본값 부족으로 Bus error 발생)
inputs:
  yolo_data:
    type: uri_folder
    path: ../data/processed/aihub/yolo
outputs:
  results:
    type: uri_folder
environment_variables:
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
command: >-
  pip uninstall -y -q opencv-python &&
  pip install -q --force-reinstall --no-deps "opencv-python-headless<4.11" &&
  python -c "import cv2; print('cv2', cv2.__version__)" &&
  python azureml/yolo/run_yolo11_cls.py ${{inputs.yolo_data}} ${{outputs.results}} --models yolo11m-cls --epochs 50 --img 448
