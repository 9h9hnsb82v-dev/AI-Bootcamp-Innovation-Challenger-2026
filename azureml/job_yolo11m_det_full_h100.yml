$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# YOLO11m 결함 위치 검출 (사용자 결정 2026-11-14 (b): AI-Hub 원본 전체로 직접 학습, 약 $10~15)
# Ultralytics AGPL-3.0 - 내부 전용, 코드·모델 공개/배포 금지(사용자 허락 전). 서비스에서는 위치 표시용(판정 아님).
# 라벨 자산: az ml data create -n aihub-full-det-labels -v 1 --type uri_folder --path data/processed/aihub_det_labels
# 실행: az ml job create -f azureml/job_yolo11m_det_full_h100.yml -w <workspace> -g <resource-group>
type: command
display_name: resource-yolo11m-det-full-e20-h100
experiment_name: resource-predict-ai-vision
description: AI-Hub 도어/범퍼/휀더 원본 전체 결함 박스(scratch/exterior_damage/gap_defect/gap_normal) YOLO11m 검출 640px 20에폭(검증 mAP 20에폭 정체 확인 후 재학습)
code: ..
environment: azureml:resource-ultralytics@latest
compute: azureml:gpu-h100
resources:
  shm_size: 32g
inputs:
  images:
    type: uri_folder
    path: azureml:aihub-full-640:1
    mode: download
  labels:
    type: uri_folder
    path: azureml:aihub-full-det-labels:1
    mode: download
outputs:
  results:
    type: uri_folder
environment_variables:
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
command: >-
  pip uninstall -y -q opencv-python &&
  pip install -q --force-reinstall --no-deps "opencv-python-headless<4.11" &&
  python azureml/yolo/run_yolo11_det.py ${{inputs.images}} ${{inputs.labels}} ${{outputs.results}} --model yolo11m.pt --epochs 20 --img 640 --batch 32
