$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# YOLOv7 개선 실험 ①+② (사용자 승인 2026-11-10) - gap_normal 제거(3클래스, 양품=배경) + image-weights(배경 평균 가중치 보정)
# 실행: az ml job create -f azureml/job_yolov7_h100_3cls_iw.yml -w AIBIC_10_24_workspace -g stu_AIBIC2026_15_RG_EUS2
type: command
display_name: resource-yolov7-aihub-h100-3cls-iw
experiment_name: resource-predict-ai-vision
description: AI-Hub YOLOv7 3클래스(gap_normal 제거) + image-weights - 640px, 100에폭, 배치 32 (100에폭 4클래스 실험과 나머지 동일)
code: ..
environment: azureml:resource-yolov7@latest
compute: azureml:gpu-h100
inputs:
  yolo_data:
    type: uri_folder
    path: ../data/processed/aihub/yolo
outputs:
  results:
    type: uri_folder
environment_variables:
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
  YOLO_DROP_GAP_NORMAL: "1"
  YOLO_IMAGE_WEIGHTS: "1"
command: >-
  bash azureml/yolo/run_yolov7.sh ${{inputs.yolo_data}} ${{outputs.results}} 100 32
